generations:
  - name: "First Generation"
    start_year: 2020
    end_year: 2024
    description: "The Citroën ë-C4 is the all-electric variant of the third-generation C4, sharing its crossover-inspired design that blends hatchback, SUV, and coupe elements. Unveiled on 16 June 2020, it is built on Stellantis' PSA EMP1 dedicated electric platform. The pre-facelift version features a distinctive exterior with a sloping roofline, split-level lighting, and protective body cladding. Power comes from a front-mounted electric motor producing 100 kW (136 HP) and 260 Nm of torque, enabling 0-100 km/h acceleration in approximately 9.7 seconds and a top speed of 150 km/h. The 50 kWh lithium-ion battery is mounted under the floor and provides a WLTP range of approximately 350 km (217 miles). Charging capabilities include support for up to 100 kW DC fast charging. The interior showcases Citroën's 'Advanced Comfort' philosophy with particularly supportive seats, a 10-inch touchscreen infotainment system, digital instrument display, and a unique retractable head-up display. Suspension features Progressive Hydraulic Cushions for exceptional ride quality. The ë-C4 offers three driving modes (Eco, Normal, and Sport) and adjustable regenerative braking levels. As one of the first electric vehicles based on the EMP1 platform, the ë-C4 represents Citroën's initial step in its electrification strategy, offering zero-emission mobility in a distinctive package that bridges multiple vehicle segments."
  - name: "First Generation (2025 Facelift)"
    start_year: 2025
    end_year: null
    description: "The 2025 facelift of the Citroën ë-C4, unveiled at the 2024 Paris Motor Show, introduces significant visual and technical updates. The exterior features a redesigned front fascia with the latest Citroën brand logo and new LED taillights. The interior has been substantially refreshed with new Advanced Comfort seats featuring thicker foam padding, a new 7-inch digital instrument cluster, and updated touchscreen infotainment software. The ë-C4 continues to be powered by the 100 kW electric motor on the PSA EMP1 platform, now with enhanced battery options up to 54 kWh, extending the WLTP range to 415 km. The manual transmission option has been discontinued. All other core features remain consistent with the pre-facelift generation, maintaining Citroën's commitment to comfort and zero-emission mobility."
